<!DOCTYPE html>
<!-- Source de l'image de partage (public/images/partage.png, 1200 × 630).
     Rendue par site/scripts/partage.sh avec le Chrome du poste. -->
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Image de partage</title>
<style>
@font-face { font-family: Archivo; src: url(../public/fonts/archivo-700.woff2); font-weight: 700; }
@font-face { font-family: "Atkinson Next"; src: url(../public/fonts/atkinson-next-400.woff2); font-weight: 400; }
html, body { margin: 0; }
body { width: 1200px; height: 630px; overflow: hidden; background: #f7f9fa; color: #131c23;
  font-family: "Atkinson Next"; position: relative; }
.filet { position: absolute; left: 0; right: 0; bottom: 0; height: 12px; background: #7655fa; }
.marque { position: absolute; left: 72px; top: 64px; display: flex; align-items: center; gap: 16px;
  font: 700 32px/1 Archivo; letter-spacing: -0.01em; }
.marque img { width: 52px; height: 52px; border-radius: 10px; }
h1 { position: absolute; left: 72px; top: 170px; width: 640px; margin: 0;
  font: 700 64px/68px Archivo; letter-spacing: -0.02em; text-wrap: balance; }
p { position: absolute; left: 72px; top: 460px; width: 600px; margin: 0; font-size: 28px; line-height: 38px; color: #45535c; }
.tel { position: absolute; right: 88px; top: 56px; width: 300px; border-radius: 24px; overflow: hidden;
  border: 1px solid #c3cdd3; box-shadow: 0 8px 24px rgba(11,20,26,.14); background: #fff; }
.tel img { display: block; width: 100%; }
</style>
</head>
<body>
<div class="marque"><img src="../public/images/icone.svg" alt="">Astreinte SP</div>
<h1>Le planning d'astreinte, validé par chaque pompier.</h1>
<p>Pour les centres de secours. 55&#8239;€ par mois, essai gratuit.</p>
<div class="tel"><img src="captures/a-accueil-pompier.png" alt=""></div>
<div class="filet"></div>
</body>
</html>
