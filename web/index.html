<!DOCTYPE html>
<html lang="fr">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Gestion des astreintes pour les centres de secours.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">

  <!-- Couleur de chrome du navigateur : surface-container-low du thème actif
       (DESIGN.md § Zones sûres et chrome PWA). -->
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F7F9FA">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#141C22">
  <meta name="apple-mobile-web-app-title" content="Astreinte SP">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!--
    Polices embarquées préchargées : sans cela, la grille d'états s'affiche
    d'abord dans la police système puis saute (FOUT), ce qui est un défaut de
    lecture sur une matrice de 62 cases. Seules les graisses présentes au
    premier écran sont préchargées ; les autres suivent avec le bundle.
  -->
  <link rel="preload" as="font" type="font/ttf" crossorigin
        href="assets/assets/fonts/AtkinsonHyperlegibleNext-Regular.ttf">
  <link rel="preload" as="font" type="font/ttf" crossorigin
        href="assets/assets/fonts/AtkinsonHyperlegibleNext-Bold.ttf">
  <link rel="preload" as="font" type="font/ttf" crossorigin
        href="assets/assets/fonts/AtkinsonHyperlegibleMono-SemiBold.ttf">

  <title>Astreinte SP</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
