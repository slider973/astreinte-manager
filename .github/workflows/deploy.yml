# Mise en ligne d'Astreinte SP : la base, les fonctions, puis la PWA.
#
# **Ce workflow ne vérifie rien.** Il part de `workflow_run` : il ne démarre
# qu'après une exécution *réussie* de « CI » sur `main` — analyse, tests, build
# web, parcours complet, migrations, RLS et Edge Functions compris. Redire ici
# ce que `ci.yml` dit déjà doublerait le temps d'attente et, le jour où les deux
# copies divergeraient, ferait passer en production ce que la CI refuse.
#
# ## L'ordre, et pourquoi il est celui-là (ticket 049)
#
#   base → fonctions → configuration ─┐
#                   ↘ PWA (Vercel) ───┴→ vérification d'écart
#
# Une Edge Function qui appelle une procédure que la base n'a pas encore ne rend
# pas un message clair, elle rend une erreur de serveur ; et une PWA qui appelle
# une fonction pas encore déployée rend un 404 que l'utilisateur lit « Impossible
# de joindre le serveur ». L'ordre inverse casse la production quelques minutes à
# chaque déploiement. La base d'abord, donc, puis les fonctions, puis la PWA.
#
# Jusqu'au 21 septembre 2026, ce fichier ne connaissait **que** la PWA. Onze Edge
# Functions n'avaient jamais été déployées et cinq migrations manquaient, depuis
# le premier jour, sans que rien ne le signale : le défaut s'est découvert quand
# le propriétaire a voulu inviter son premier pompier.
#
# ## Le garde-fou de la base : exécution à blanc, pas approbation humaine
#
# Les deux étaient sur la table (ticket 049). L'approbation a perdu sur un point
# précis : le critère d'acceptation du ticket demande qu'une PR fusionnée voie sa
# migration appliquée **sans intervention manuelle**. Un environnement protégé
# exigerait un clic à chaque fusion, y compris pour les neuf PR sur dix qui ne
# touchent pas la base, et la file de tickets s'arrêterait à la première nuit.
#
# À la place : `supabase db push --dry-run`, qui nomme les migrations qu'il
# appliquerait, **immédiatement avant** de les appliquer pour de bon, dans le même
# travail et sur le même commit. Le résultat est écrit dans le résumé de
# l'exécution : « ce qui est parti en production, et quand » se lit après coup,
# sans ouvrir de journal.
#
# Ce choix reste réversible sans toucher à ce fichier, et **sans arrêter le
# reste** : le travail « base » déclare `environment: production-base`, un
# environnement à lui, quand les trois autres déclarent `production`. Le jour où
# une migration demandera un regard humain, ajouter un relecteur requis à
# `production-base` (Settings → Environments) fera attendre les migrations —
# elles seules. Les fonctions, la configuration et la PWA suivront derrière,
# puisqu'elles dépendent de « base », mais sans demander chacune leur clic : un
# relecteur posé sur `production` en réclamerait quatre par mise en ligne.
#
# Corollaire à ne pas oublier : les secrets `SUPABASE_*` doivent être des secrets
# **de dépôt** et non d'environnement. Le travail « verification » appelle
# `verifier-production.yml`, qui ne déclare aucun `environment:` ; des secrets
# rangés dans `production` lui seraient invisibles et la vérification s'arrêterait
# en disant qu'ils manquent (docs/DEPLOIEMENT.md § 3).
#
# ## La construction de la PWA
#
# Elle se fait **sur l'exécuteur**, pas chez Vercel : la configuration de
# l'application (`SUPABASE_URL`, les cinq `FIREBASE_*`) est lue par
# `String.fromEnvironment`, donc résolue à la **compilation**. Une variable posée
# dans le tableau de bord Vercel n'atteindrait jamais le binaire. C'est pourquoi
# les valeurs de production sont des *secrets GitHub* et non des variables
# d'environnement Vercel — voir `docs/DEPLOIEMENT.md § 3`.
#
# Aucune de ces valeurs n'est obligatoire. Sans elles, l'application se déploie,
# s'ouvre, et dit « Application non configurée » ou « notifications
# indisponibles » au lieu de planter : c'est l'état voulu tant que la base
# distante, Firebase et Stripe ne sont pas branchés.
name: Déploiement

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  # Rejouer une mise en ligne sans repasser par un commit.
  workflow_dispatch:

# Une seule mise en ligne à la fois, et c'est la dernière qui gagne. Elle n'est
# **pas** annulable en vol : couper `vercel deploy` au milieu laisserait un
# déploiement à moitié téléversé, et couper `db push` au milieu laisserait la
# base entre deux migrations.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.38.10
  # La même que la tâche « base-donnees » de la CI : ce qui a rejoué les
  # migrations en intégration les applique en production.
  SUPABASE_CLI_VERSION: 2.117.0

jobs:
  # ---------------------------------------------------------------------------
  # 1. La base. Tout le reste en dépend.
  # ---------------------------------------------------------------------------
  base:
    name: Base — migrations et secrets Vault
    # Une CI rouge ne se déploie pas. `workflow_dispatch` n'a pas de
    # `workflow_run`, d'où la seconde branche — mais **seulement depuis `main`**.
    # « Run workflow » propose toutes les branches du dépôt ; sans ce
    # `github.ref`, un clic depuis une branche de travail appliquerait ses
    # migrations en production sans qu'aucune CI les ait jouées, et le
    # `checkout` ci-dessous les prendrait bien, puisque faute de `workflow_run`
    # il retombe sur `github.ref`.
    #
    # Les quatre travaux suivants n'ont pas de `if` : ils héritent de cette
    # garde par leurs `needs`, un travail sauté sautant ses dépendants.
    # « fonctions » dépend de « base », « configuration » et « vercel » de
    # « fonctions », et « verification » exige explicitement
    # `needs.base.result != 'skipped'` parce que son `!cancelled()` la ferait
    # tourner même après un saut.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # **Son propre environnement, et c'est tout l'intérêt.** Les trois autres
    # travaux déclarent `production` ; si `base` le déclarait aussi, ajouter un
    # relecteur requis à `production` demanderait quatre approbations par mise en
    # ligne, PWA comprise, pour protéger la seule base. Avec `production-base`,
    # le garde-fou humain se pose là où il a un sens — Settings → Environments →
    # production-base → Required reviewers — et ne porte que sur les migrations.
    # Rien à changer dans ce fichier le jour où il servira.
    environment: production-base
    steps:
      # Le commit exact que la CI a validé, jamais « la tête de main » : entre
      # les deux, `main` a pu avancer.
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Installer le CLI Supabase
        uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      # Le jeton d'accès et la référence du projet sont des secrets : aucune des
      # deux valeurs n'est dans le dépôt. Sans elles, mieux vaut s'arrêter en
      # nommant ce qui manque que d'échouer trois étapes plus loin sur une erreur
      # d'authentification.
      - name: Vérifier les secrets Supabase
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          manquants=""
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || manquants="$manquants SUPABASE_ACCESS_TOKEN"
          [ -n "$SUPABASE_PROJECT_REF" ]  || manquants="$manquants SUPABASE_PROJECT_REF"
          if [ -n "$manquants" ]; then
            echo "::error::Secrets absents :$manquants. Les poser dans Settings → Secrets and variables → Actions (voir docs/DEPLOIEMENT.md § 3). Sans eux, la base et les fonctions restent en retard sur le dépôt."
            exit 1
          fi

      # **Le garde-fou.** Aucune écriture : `--dry-run` liste, `--skip-vault`
      # empêche même la mise à jour des secrets déclarés dans config.toml. Ce que
      # cette étape imprime est exactement ce que la suivante applique.
      #
      # Pas de mot de passe de base : `--project-ref` avec le jeton d'accès
      # suffit, le CLI ouvre un rôle de connexion temporaire par l'API de gestion.
      # Vérifié le 21 septembre 2026 contre le projet de production.
      - name: Exécution à blanc — ce qui va être appliqué
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -o pipefail
          supabase db push \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --include-all --dry-run --skip-vault \
            --output-format text 2>&1 | tee /tmp/a-blanc.txt
          {
            echo "### Base — exécution à blanc"
            echo ""
            echo '```'
            cat /tmp/a-blanc.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # `--include-all` : une migration antérieure à la dernière appliquée mais
      # absente de l'historique distant est un trou, pas un passé. C'est ce trou
      # qui avait avalé 0030 à 0034.
      #
      # Sans `--skip-vault` cette fois : `db push` pose d'abord les secrets Vault
      # déclarés dans `[remotes.production.db.vault]`, dont l'adresse où la base
      # joint `send-notification`. Posée à chaque mise en ligne, sans effet quand
      # elle est déjà bonne.
      - name: Appliquer les migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -o pipefail
          supabase db push \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --include-all --yes \
            --output-format text 2>&1 | tee /tmp/applique.txt
          {
            echo "### Base — appliqué"
            echo ""
            echo '```'
            cat /tmp/applique.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # 2. Les Edge Functions. Après la base dont elles dépendent, avant la PWA qui
  #    les appelle.
  # ---------------------------------------------------------------------------
  fonctions:
    name: Edge Functions — mise en ligne
    needs: base
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Installer le CLI Supabase
        uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      # **Les onze, à chaque fois.** Ne déployer que ce qui a changé demanderait
      # de comparer des empreintes au projet distant ; se tromper là-dessus, c'est
      # laisser une fonction en retard sur la base, et c'est précisément le défaut
      # que ce ticket répare. Onze fonctions coûtent moins de deux minutes avec
      # `--use-api` (empaquetage côté serveur, aucune image Docker à télécharger)
      # et quatre déploiements de front.
      #
      # `verify_jwt` n'est pas passé en option : le CLI lit `supabase/config.toml`,
      # seul endroit où le portier de chaque fonction est décidé — et raisonné.
      #
      # Pas de `--prune` : une fonction déployée que le dépôt ne connaît plus est
      # signalée par la vérification d'écart, pas supprimée sans qu'on l'ait lu.
      - name: Déployer les Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -o pipefail
          supabase functions deploy \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --use-api --jobs 4 2>&1 | tee /tmp/fonctions.txt
          {
            echo "### Edge Functions"
            echo ""
            echo '```'
            cat /tmp/fonctions.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # 3. La configuration d'authentification.
  #
  #    Quatre réglages — gabarit de courriel, serveur d'envoi, plafond horaire,
  #    adresses de redirection — n'étaient reproductibles nulle part. Résultat le
  #    21 septembre 2026 : la production servait le gabarit anglais par défaut de
  #    Supabase, qui envoie un lien là où l'application attend six chiffres.
  #    Ouvrir le lien change de page, le jeton d'invitation ne vit qu'en mémoire,
  #    et l'invitation ne peut plus être acceptée.
  #
  #    Ce travail ne bloque pas la PWA : une configuration d'authentification en
  #    retard mérite d'être rouge, pas d'empêcher un correctif d'écran de partir.
  # ---------------------------------------------------------------------------
  configuration:
    name: Authentification — configuration du projet
    needs: fonctions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Installer le CLI Supabase
        uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      # Le mot de passe SMTP est la clé d'API Resend : elle ne peut pas vivre dans
      # le dépôt. Sans elle, `config push` écrirait un mot de passe **vide** sur un
      # serveur d'envoi déclaré actif, et plus aucun courriel ne partirait — donc
      # plus personne ne se connecterait. On s'arrête avant, en le disant.
      - name: Vérifier le secret du serveur d'envoi
        env:
          SUPABASE_AUTH_SMTP_PASSWORD: ${{ secrets.SUPABASE_AUTH_SMTP_PASSWORD }}
        run: |
          if [ -z "$SUPABASE_AUTH_SMTP_PASSWORD" ]; then
            echo "::error::Secret SUPABASE_AUTH_SMTP_PASSWORD absent : c'est la clé d'API Resend (re_…). Sans elle, pousser la configuration couperait l'envoi des courriels de connexion. La poser dans Settings → Secrets and variables → Actions (docs/DEPLOIEMENT.md § 3)."
            exit 1
          fi

      # `config diff` avant `config push`, et ce n'est pas de la prudence
      # décorative : le CLI le demande lui-même pour un usage non interactif, où
      # les confirmations par ressource sont répondues « oui » d'office. Le diff
      # part dans le résumé ; on y lit ce que la poussée a changé.
      - name: Comparer la configuration au projet
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_AUTH_SMTP_PASSWORD: ${{ secrets.SUPABASE_AUTH_SMTP_PASSWORD }}
        run: |
          set -o pipefail
          supabase config diff --project-ref "$SUPABASE_PROJECT_REF" 2>&1 | tee /tmp/config-diff.txt
          {
            echo "### Configuration — écarts avant poussée"
            echo ""
            echo '```'
            cat /tmp/config-diff.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # `config push` ne pousse que ce que `supabase/config.toml` déclare, et la
      # section `[remotes.production]` y remplace les valeurs de la pile locale :
      # sans elle, la production repartirait sur `http://127.0.0.1:3000` et plus
      # aucun lien de connexion ne fonctionnerait.
      - name: Pousser la configuration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_AUTH_SMTP_PASSWORD: ${{ secrets.SUPABASE_AUTH_SMTP_PASSWORD }}
        run: supabase config push --project-ref "$SUPABASE_PROJECT_REF" --yes

  # ---------------------------------------------------------------------------
  # 4. La PWA, en dernier : elle appelle tout le reste.
  # ---------------------------------------------------------------------------
  vercel:
    name: PWA — construire et mettre en ligne
    needs: fonctions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ steps.mise_en_ligne.outputs.url }}
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      # Le jeton doit être un jeton **de compte** (réglages personnels Vercel),
      # pas un jeton lié au projet : ce dernier fait répondre « User not found »
      # à la ligne de commande, et la mise en ligne échoue ici, exprès et tout de
      # suite (docs/DEPLOIEMENT.md § 2).
      - name: Vérifier les jetons de l'hébergeur
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_SCOPE: ${{ secrets.VERCEL_SCOPE }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          manquants=""
          [ -n "$VERCEL_TOKEN" ]      || manquants="$manquants VERCEL_TOKEN"
          [ -n "$VERCEL_ORG_ID" ]     || manquants="$manquants VERCEL_ORG_ID"
          [ -n "$VERCEL_PROJECT_ID" ] || manquants="$manquants VERCEL_PROJECT_ID"
          if [ -n "$manquants" ]; then
            echo "::error::Secrets absents :$manquants. Les poser dans Settings → Secrets and variables → Actions (voir docs/DEPLOIEMENT.md § 3)."
            exit 1
          fi

      - name: Installer Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Restaurer le cache pub
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-

      - name: Récupérer les dépendances
        run: flutter pub get

      # `env/prod.json` n'est pas versionné (`.gitignore`) : il est reconstruit
      # ici à partir des secrets. `jq` échappe tout seul ce qui doit l'être.
      # Un secret absent donne une chaîne vide, et c'est un cas prévu par
      # `lib/core/env.dart`.
      - name: Composer env/prod.json
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_VAPID_KEY: ${{ secrets.FIREBASE_VAPID_KEY }}
        run: |
          jq -n \
            --arg supabaseUrl "$SUPABASE_URL" \
            --arg supabaseAnonKey "$SUPABASE_ANON_KEY" \
            --arg firebaseProjectId "$FIREBASE_PROJECT_ID" \
            --arg firebaseApiKey "$FIREBASE_API_KEY" \
            --arg firebaseAppId "$FIREBASE_APP_ID" \
            --arg firebaseSenderId "$FIREBASE_MESSAGING_SENDER_ID" \
            --arg firebaseVapidKey "$FIREBASE_VAPID_KEY" \
            '{
              APP_ENV: "prod",
              SUPABASE_URL: $supabaseUrl,
              SUPABASE_ANON_KEY: $supabaseAnonKey,
              FIREBASE_PROJECT_ID: $firebaseProjectId,
              FIREBASE_API_KEY: $firebaseApiKey,
              FIREBASE_APP_ID: $firebaseAppId,
              FIREBASE_MESSAGING_SENDER_ID: $firebaseSenderId,
              FIREBASE_VAPID_KEY: $firebaseVapidKey
            }' > env/prod.json

          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::warning::SUPABASE_URL ou SUPABASE_ANON_KEY absent : l'application se déploiera et affichera « Application non configurée »."
          fi
          if [ -z "$FIREBASE_VAPID_KEY" ]; then
            echo "::warning::Configuration Firebase incomplète : l'application se déploiera sans notifications, et le dira (docs/FIREBASE.md)."
          fi

      - name: Installer brotli
        run: sudo apt-get update -qq && sudo apt-get install -y -qq brotli

      # Construction, élagage et compression brotli du moteur CanvasKit
      # (5,7 Mo → 1,6 Mo) et des polices (194 Ko → ~88 Ko) — ticket 037.
      - name: Construire la PWA
        run: scripts/build_web.sh env/prod.json

      - name: Mettre en ligne sur Vercel
        id: mise_en_ligne
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_SCOPE: ${{ secrets.VERCEL_SCOPE }}
        run: |
          # `vercel build` ne reconstruit rien : `vercel.json` porte un
          # `buildCommand` qui ne fait qu'un `echo`. Il empaquette `build/web`
          # dans `.vercel/output` avec les en-têtes et les réécritures, que
          # `--prebuilt` téléverse tels quels.
          # `--scope` est indispensable avec un jeton limité à une équipe :
          # sans lui, le client cherche un contexte utilisateur qu'un tel jeton
          # n'a pas, et échoue sur « Could not retrieve Project Settings ».
          portee=(); if [ -n "${VERCEL_SCOPE:-}" ]; then portee=(--scope "$VERCEL_SCOPE"); fi
          npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN" "${portee[@]}"
          npx --yes vercel@latest build --prod --token="$VERCEL_TOKEN" "${portee[@]}"
          url="$(npx --yes vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN" "${portee[@]}")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Mis en ligne : $url" >> "$GITHUB_STEP_SUMMARY"

      # Le piège numéro un de ce déploiement : un CDN qui recompresserait ce
      # qui l'est déjà, ou qui oublierait l'en-tête. Pour les polices, Flutter
      # échoue au décodage **en silence** ; pour le moteur, il ne démarre pas
      # du tout et la page reste blanche. Mieux vaut une mise en ligne rouge.
      - name: Vérifier les en-têtes servis
        env:
          URL: ${{ steps.mise_en_ligne.outputs.url }}
        run: |
          police="$URL/assets/assets/fonts/AtkinsonHyperlegibleNext-Regular.ttf"
          entetes="$(curl -sSIL -H 'Accept-Encoding: br' "$police" | tr 'A-Z' 'a-z')"
          echo "$entetes"
          echo "$entetes" | grep -q 'content-encoding: br' || {
            echo "::error::Les polices ne sont pas servies en brotli : Flutter retombera sur Roboto depuis fonts.gstatic.com."
            exit 1
          }

          # Auto-hébergé depuis le ticket 037 : c'est cette compression qui
          # rend l'opération neutre en octets face au CDN de Google.
          moteur="$URL/canvaskit/chromium/canvaskit.wasm"
          entetes="$(curl -sSIL -H 'Accept-Encoding: br' "$moteur" | tr 'A-Z' 'a-z')"
          echo "$entetes"
          echo "$entetes" | grep -q 'content-encoding: br' || {
            echo "::error::Le moteur CanvasKit n'est pas servi en brotli : l'application ne démarrera pas (« expected magic word »)."
            exit 1
          }

          sw="$(curl -sSIL "$URL/flutter_service_worker.js" | tr 'A-Z' 'a-z')"
          echo "$sw"
          echo "$sw" | grep -q 'must-revalidate' || {
            echo "::error::flutter_service_worker.js est mis en cache : les téléphones déjà installés ne verront plus aucune mise à jour."
            exit 1
          }

  # ---------------------------------------------------------------------------
  # 5. Le dernier mot : le dépôt et la production disent-ils la même chose ?
  #
  #    `!cancelled()` et non `success()` : c'est quand une étape précédente a
  #    échoué que la question devient intéressante. Le compte rendu nomme ce qui
  #    est resté en arrière plutôt que de se taire avec elle.
  # ---------------------------------------------------------------------------
  verification:
    name: Vérification d'écart
    needs: [base, fonctions, configuration, vercel]
    if: ${{ !cancelled() && needs.base.result != 'skipped' }}
    uses: ./.github/workflows/verifier-production.yml
    with:
      ref: ${{ github.event.workflow_run.head_sha || github.ref }}
    secrets: inherit
