# Intégration continue d'Astreinte SP.
#
# Quatre tâches en parallèle, chacune autosuffisante :
#   - « flutter »        : analyse, tests unitaires et de widgets, build web (le canal principal) ;
#   - « parcours »       : le parcours complet d'un mois, dans un Chrome sans interface ;
#   - « base-donnees »   : rejeu complet des migrations, tests RLS et lint du schéma ;
#   - « edge-functions » : types, lint, format et tests unitaires des fonctions Deno.
#
# Budget visé : moins de dix minutes de bout en bout. Toute étape lente ou instable doit
# être retirée plutôt que tolérée : une CI qui échoue au hasard ne protège plus rien.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Une seule exécution utile par branche : les poussées successives annulent la précédente.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Épinglée sur la version du poste de développement (flutter --version).
  # À remonter en même temps que l'équipe, jamais automatiquement.
  FLUTTER_VERSION: 3.38.10

jobs:
  flutter:
    name: Flutter — analyse, tests, build web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Restaurer le cache pub
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-

      - name: Récupérer les dépendances
        run: flutter pub get

      # `--fatal-infos` : le dépôt est vierge d'infos, on garde ce niveau d'exigence.
      - name: Analyser
        run: flutter analyze --fatal-infos

      - name: Tester
        run: flutter test

      # Le build web est la cible qui part en production (PWA). Mesuré à ~35 s en local,
      # il reste dans cette tâche ; s'il dépassait cinq minutes sur l'exécuteur, l'isoler.
      - name: Construire la PWA
        run: flutter build web --dart-define-from-file=env/dev.json

  # Le parcours complet d'un mois (ticket 035) : l'admin invite, la recrue accepte,
  # saisit son mois, l'admin construit et publie, la recrue refuse, l'admin réattribue,
  # le second pompier accepte, le planning se valide.
  #
  # **Une tâche à part, et volontairement.** Le critère d'acceptation du ticket est
  # chiffré — « le parcours complet passe en CI en moins de 10 minutes » —, et il se
  # lit ici, sur une durée à lui. `timeout-minutes` porte ce budget : dépassé, la
  # tâche échoue au lieu de s'étirer en silence. Mesuré à ~20 s sur un poste de
  # développement, compilation comprise.
  #
  # Le navigateur est celui de l'exécuteur (`google-chrome`, préinstallé sur
  # `ubuntu-latest`), sans interface. Aucun chromedriver, aucun pilote extérieur :
  # `--platform chrome` compile le test avec l'application et le fait tourner
  # **dans** la page. Le paquet `integration_test` ne sert pas ici — Flutter 3.38
  # répond « Web devices are not supported for integration tests yet » ; le détail
  # est dans `test/parcours/README.md`.
  #
  # Ce que cette tâche ne joint pas : Supabase. Le serveur du parcours est une
  # caserne en mémoire qui rejoue les règles de la base ; les règles elles-mêmes
  # sont éprouvées par la tâche « base-donnees », qui joue le même fil en SQL
  # (`supabase/tests/parcours_complet_test.sql`).
  parcours:
    name: Parcours — bout en bout sur Chrome headless
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Restaurer le cache pub
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-

      - name: Récupérer les dépendances
        run: flutter pub get

      - name: Jouer le parcours complet
        run: flutter test --platform chrome test/parcours
        env:
          CHROME_EXECUTABLE: /usr/bin/google-chrome

  base-donnees:
    name: Base de données — migrations, RLS, lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer le CLI Supabase
        uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      # Stack réduite au strict nécessaire pour les migrations et la RLS :
      # Postgres (le schéma) et GoTrue (qui crée auth.users, référencé par 0002).
      # Les autres conteneurs ne servent qu'au développement local et coûteraient
      # plus de 4 Go de téléchargement d'images à chaque exécution.
      - name: Démarrer Supabase (Postgres + Auth)
        run: |
          supabase start \
            -x studio,imgproxy,mailpit,edge-runtime,logflare,vector,supavisor,postgres-meta,storage-api,realtime,postgrest,kong

      # Rejeu depuis zéro : une migration non rejouable ou un seed cassé échoue ici.
      - name: Rejouer les migrations et le seed
        run: supabase db reset

      # `scripts/test_rls.sh` joue **tout** `supabase/tests/*.sql` : les politiques,
      # les fonctions, les tâches planifiées jouées avec une date de référence, et
      # depuis le ticket 035 le parcours complet d'un mois de bout en bout. Mesuré à
      # ~16 s en local, la concurrence comprise.
      - name: Tests RLS, fonctions, tâches planifiées et parcours complet
        run: scripts/test_rls.sh
        env:
          DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

      - name: Lint du schéma
        run: supabase db lint --local --fail-on error

  # Les Edge Functions ne sont pas joignables dans la tâche ci-dessus : la pile y
  # démarre sans `edge-runtime` ni `kong`, pour ne pas télécharger 4 Go d'images.
  # Leur logique de décision vit donc dans des modules purs (`_shared/`), testables
  # sans base, sans réseau et sans clés Firebase. C'est ce que cette tâche vérifie,
  # en moins d'une minute et sans Docker.
  #
  # Ce qui reste hors CI : la couche HTTP (`scripts/test_functions.sh`), qui a besoin
  # de `supabase functions serve` et se lance à la main avant de pousser.
  edge-functions:
    name: Edge Functions — types, lint, tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: supabase/functions
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      # **Ce que les quatre étapes suivantes ne peuvent pas voir** (ticket 054).
      # `deno fmt`, `deno lint`, `deno check` et `deno test` lisent le
      # `supabase/functions/deno.json` local, trouvé en remontant les dossiers :
      # `@supabase/supabase-js` s'y résout, tout passe. Le déploiement, lui,
      # empaquette **côté serveur** (`--use-api`) sur les seuls fichiers
      # téléversés, et ce `deno.json` n'en faisait pas partie : les onze
      # fonctions ont été refusées à l'empaquetage le 21 septembre 2026, sans
      # qu'aucune CI ait pu le dire.
      #
      # Cette étape lit la commande de déploiement dans `deploy.yml`, en déduit
      # la carte que le déploiement enverra, et vérifie que chaque specifier nu
      # du graphe des onze fonctions y est résolu. Elle échoue donc dans les
      # deux cas à craindre : la carte retirée de la commande, ou un specifier
      # nu qu'elle ne couvre pas. Sans réseau, sans Deno, en moins d'une seconde.
      - name: Vérifier la carte d'imports du déploiement
        working-directory: ${{ github.workspace }}
        run: python3 scripts/verifier_carte_imports.py

      - name: Installer Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Vérifier le format
        run: deno fmt --check

      - name: Linter
        run: deno lint

      # Chaque fonction est typée contre `supabase/types/database.types.ts`, versionné
      # exprès (docs/SCHEMA.md § 10) : une migration oubliée dans les types se voit ici.
      - name: Vérifier les types
        run: |
          deno check send-notification/index.ts
          deno check invite-member/index.ts
          deno check accept-invitation/index.ts
          deno check delete-account/index.ts
          deno check export-user-data/index.ts
          deno check publish-schedule/index.ts
          deno check reassign-shift/index.ts
          deno check auto-propose/index.ts
          deno check create-checkout/index.ts
          deno check create-checkout/acces.ts
          deno check stripe-webhook/index.ts
          deno check stripe-webhook/evenement.ts
          deno check ics-feed/index.ts
          deno check ics-feed/calendrier.ts
          deno check ics-feed/jeton.ts

      - name: Tester
        run: deno test tests/ --allow-env
