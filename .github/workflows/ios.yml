# Construit et teste l'app iOS native Foco (submodule `foco/`, ticket 066).
#
# Ne tourne **que** quand le pointeur du submodule ou ce fichier change : la
# CI Flutter (`ci.yml`) et le déploiement de la PWA (`deploy.yml`) ne voient
# jamais `foco/` — leur `actions/checkout` ne récupère pas les submodules.
#
# **Le submodule est privé.** `slider973/Foco` est le fork d'un dépôt privé
# (`T4ruxx/Foco`) : GitHub ne permet pas de le rendre public, et le jeton par
# défaut de ce workflow ne lit que ce dépôt-ci. Il faut donc un secret
# `FOCO_DEPLOY_KEY` : la partie privée d'une clé SSH de déploiement **en
# lecture seule** posée sur `slider973/Foco` (docs/IOS.md § CI). Sans lui, la
# tâche s'arrête sur une erreur qui le nomme. Les pull requests venant d'un
# fork n'ont pas accès aux secrets : pour elles, la tâche échoue de même.
#
# La recette (Xcode, simulateur, build, tests, captures) vit dans le fork,
# `foco/scripts/ci.sh`, partagée avec sa propre CI.
name: iOS

on:
  pull_request:
    branches: [main]
    paths:
      - foco
      - .gitmodules
      - .github/workflows/ios.yml
  push:
    # `feat/066-app-ios-native` : le temps d'éprouver le workflow avant la PR
    # (GitHub ne propose `workflow_dispatch` qu'à partir de `main`). À retirer
    # avant la PR.
    branches: [main, feat/066-app-ios-native]
    paths:
      - foco
      - .gitmodules
      - .github/workflows/ios.yml
  workflow_dispatch:

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  foco:
    name: Foco — build et tests (iPhone 17 Pro, iOS 26.4)
    # macOS 26 arm64 : seule image qui porte Xcode 26.4.1, le SDK iOS 26.4 et
    # un iPhone 17 Pro sous iOS 26.4 (actions/runner-images,
    # images/macos/macos-26-arm64-Readme.md). macos-15 s'arrête à Xcode 26.3.
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Vérifier la clé de déploiement du submodule
        env:
          FOCO_DEPLOY_KEY: ${{ secrets.FOCO_DEPLOY_KEY }}
        run: |
          if [ -z "$FOCO_DEPLOY_KEY" ]; then
            echo "::error::Secret FOCO_DEPLOY_KEY absent : le submodule foco/ (slider973/Foco) est privé. Poser une clé de déploiement en lecture seule, voir docs/IOS.md § CI."
            exit 1
          fi

      - name: Récupérer le submodule foco/
        env:
          FOCO_DEPLOY_KEY: ${{ secrets.FOCO_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$FOCO_DEPLOY_KEY" > ~/.ssh/foco_deploy_key
          chmod 600 ~/.ssh/foco_deploy_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          git -c url."git@github.com:".insteadOf="https://github.com/" \
              -c core.sshCommand="ssh -i ~/.ssh/foco_deploy_key -o IdentitiesOnly=yes" \
              submodule update --init --depth 1 foco
          rm -f ~/.ssh/foco_deploy_key
          git -C foco log --oneline -1

      - name: Restaurer les paquets Swift
        uses: actions/cache@v4
        with:
          path: foco/build/ci/spm
          key: spm-${{ runner.os }}-${{ hashFiles('foco/Foco.xcodeproj/project.pbxproj') }}

      - name: Construire, tester, capturer
        run: foco/scripts/ci.sh

      - name: Garder les captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foco-ci
          path: |
            foco/build/ci/screenshots/
            foco/build/ci/Package.resolved
            foco/build/ci/xcodebuild.log
          if-no-files-found: ignore
