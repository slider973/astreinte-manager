# For detailed configuration reference documentation, visit:
# https://supabase.com/docs/guides/local-development/cli/config
# A string used to distinguish different Supabase projects on the same host. Defaults to the
# working directory name when running `supabase init`.
project_id = "pompier"

[api]
enabled = true
# Port to use for the API URL.
port = 54321
# Schemas to expose in your API. Tables, views and stored procedures in this schema will get API
# endpoints. `public` and `graphql_public` schemas are included by default.
schemas = ["public", "graphql_public"]
# Extra schemas to add to the search_path of every request.
extra_search_path = ["public", "extensions"]
# The maximum number of rows returns from a view, table, or stored procedure. Limits payload size
# for accidental or malicious requests.
max_rows = 1000
# Controls whether new tables, views, sequences and functions created in the `public` schema by
# `postgres` are reachable through the Data API roles (`anon`, `authenticated`, `service_role`)
# without explicit GRANTs, matching the cloud default. Set to `false` to require explicit GRANTs
# instead. Left unset, a fresh project falls back to `true`.
# auto_expose_new_tables = true

[api.tls]
# Enable HTTPS endpoints locally using a self-signed certificate.
enabled = false
# Paths to self-signed certificate pair.
# cert_path = "../certs/my-cert.pem"
# key_path = "../certs/my-key.pem"

[db]
# Port to use for the local database URL.
port = 54322
# Port used by db diff command to initialize the shadow database.
shadow_port = 54320
# Maximum amount of time to wait for health check when starting the local database.
health_timeout = "2m"
# The database major version to use. This has to be the same as your remote database's. Run `SHOW
# server_version;` on the remote database to check.
major_version = 17

[db.pooler]
enabled = false
# Port to use for the local connection pooler.
port = 54329
# Specifies when a server connection can be reused by other clients.
# Configure one of the supported pooler modes: `transaction`, `session`.
pool_mode = "transaction"
# How many server connections to allow per user/database pair.
default_pool_size = 20
# Maximum number of client connections allowed.
max_client_conn = 100

# [db.vault]
# secret_key = "env(SECRET_VALUE)"

[db.migrations]
# If disabled, migrations will be skipped during a db push or reset.
enabled = true
# Specifies an ordered list of schema files, directories, or glob patterns that describe your database.
# Supports paths relative to supabase directory: "./schemas/*.sql", "./database".
schema_paths = []

[db.seed]
# If enabled, seeds the database after migrations during a db reset.
enabled = true
# Specifies an ordered list of seed files to load during db reset.
# Supports glob patterns relative to supabase directory: "./seeds/*.sql"
sql_paths = ["./seed.sql"]

[db.network_restrictions]
# Enable management of network restrictions.
enabled = false
# List of IPv4 CIDR blocks allowed to connect to the database.
# Defaults to allow all IPv4 connections. Set empty array to block all IPs.
allowed_cidrs = ["0.0.0.0/0"]
# List of IPv6 CIDR blocks allowed to connect to the database.
# Defaults to allow all IPv6 connections. Set empty array to block all IPs.
allowed_cidrs_v6 = ["::/0"]

# Uncomment to reject non-secure connections to the database.
# [db.ssl_enforcement]
# enabled = true

[realtime]
enabled = true
# Bind realtime via either IPv4 or IPv6. (default: IPv4)
# ip_version = "IPv6"
# The maximum length in bytes of HTTP request headers. (default: 4096)
# max_header_length = 4096

[studio]
enabled = true
# Port to use for Supabase Studio.
port = 54323
# External URL of the API server that frontend connects to.
api_url = "http://127.0.0.1"
# OpenAI API Key to use for Supabase AI in the Supabase Studio.
openai_api_key = "env(OPENAI_API_KEY)"

# Email testing server. Emails sent with the local dev setup are not actually sent - rather, they
# are monitored, and you can view the emails that would have been sent from the web interface.
[local_smtp]
enabled = true
# Port to use for the email testing server web interface.
port = 54324
# Uncomment to expose additional ports for testing user applications that send emails.
# smtp_port = 54325
# pop3_port = 54326
# admin_email = "admin@email.com"
# sender_name = "Admin"

[storage]
enabled = true
# The maximum file size allowed (e.g. "5MB", "500KB").
file_size_limit = "50MiB"

# Uncomment to configure local storage buckets
# [storage.buckets.images]
# public = false
# file_size_limit = "50MiB"
# allowed_mime_types = ["image/png", "image/jpeg"]
# objects_path = "./images"

# Allow connections via S3 compatible clients
[storage.s3_protocol]
enabled = true

# Image transformation API is available to Supabase Pro plan.
# [storage.image_transformation]
# enabled = true

# Store analytical data in S3 for running ETL jobs over Iceberg Catalog
# This feature is only available on the hosted platform.
[storage.analytics]
enabled = false
max_namespaces = 5
max_tables = 10
max_catalogs = 2

# Analytics Buckets is available to Supabase Pro plan.
# [storage.analytics.buckets.my-warehouse]

# Store vector embeddings in S3 for large and durable datasets
[storage.vector]
enabled = true
max_buckets = 10
max_indexes = 5

# Vector Buckets is available to Supabase Pro plan.
# [storage.vector.buckets.documents-openai]

[auth]
enabled = true
# The base URL of your website. Used as an allow-list for redirects and for constructing URLs used
# in emails.
site_url = "http://127.0.0.1:3000"
# The public URL that Auth serves on. Defaults to the API external URL with `/auth/v1` appended.
# external_url = ""
# A list of *exact* URLs that auth providers are permitted to redirect to post authentication.
# Les jokers ne servent qu'au développement local : `flutter run -d chrome`
# choisit un port au hasard, et le lien magique doit pouvoir y retomber. Le
# projet hébergé n'autorise que l'origine déployée de la PWA.
additional_redirect_urls = ["https://127.0.0.1:3000", "http://127.0.0.1:*", "http://localhost:*"]
# How long tokens are valid for, in seconds. Defaults to 3600 (1 hour), maximum 604,800 (1 week).
jwt_expiry = 3600
# JWT issuer URL. If not set, defaults to auth.external_url.
# jwt_issuer = ""
# Path to JWT signing key. DO NOT commit your signing keys file to git.
# signing_keys_path = "./signing_keys.json"
# If disabled, the refresh token will never expire.
enable_refresh_token_rotation = true
# Allows refresh tokens to be reused after expiry, up to the specified interval in seconds.
# Requires enable_refresh_token_rotation = true.
refresh_token_reuse_interval = 10
# Allow/disallow new user signups to your project.
# Faux, et c'est une règle de sécurité, pas un confort : la clé anon est publique
# par conception, donc n'importe qui peut appeler /auth/v1/otp. Avec l'inscription
# ouverte, cet appel fabrique un compte à chaque adresse inventée et consomme le
# quota d'envoi de courriels. Les comptes sont créés par l'Edge Function
# d'invitation du ticket 006, avec la clé de service, côté serveur.
enable_signup = false
# Allow/disallow anonymous sign-ins to your project.
enable_anonymous_sign_ins = false
# Allow/disallow testing manual linking of accounts
enable_manual_linking = false
# Passwords shorter than this value will be rejected as weak. Minimum 6, recommended 8 or more.
minimum_password_length = 6
# Passwords that do not meet the following requirements will be rejected as weak. Supported values
# are: `letters_digits`, `lower_upper_letters_digits`, `lower_upper_letters_digits_symbols`
password_requirements = ""

# Configure passkey sign-ins.
# [auth.passkey]
# enabled = false

# Configure WebAuthn relying party settings (required when passkey is enabled).
# [auth.webauthn]
# rp_display_name = "Supabase"
# rp_id = "localhost"
# rp_origins = ["http://127.0.0.1:3000"]

[auth.rate_limit]
# Number of emails that can be sent per hour. Requires auth.email.smtp to be enabled.
# 30 en local : les courriels partent dans Mailpit (http://127.0.0.1:54324), pas
# vers de vraies boîtes, et 2 par heure empêche de dérouler un parcours de
# connexion. Le projet hébergé garde une limite basse, réglée dans son tableau
# de bord.
email_sent = 30
# Number of SMS messages that can be sent per hour. Requires auth.sms to be enabled.
sms_sent = 30
# Number of anonymous sign-ins that can be made per hour per IP address. Requires enable_anonymous_sign_ins = true.
anonymous_users = 30
# Number of sessions that can be refreshed in a 5 minute interval per IP address.
token_refresh = 150
# Number of sign up and sign-in requests that can be made in a 5 minute interval per IP address (excludes anonymous users).
sign_in_sign_ups = 30
# Number of OTP / Magic link verifications that can be made in a 5 minute interval per IP address.
token_verifications = 30
# Number of Web3 logins that can be made in a 5 minute interval per IP address.
web3 = 30

# Configure one of the supported captcha providers: `hcaptcha`, `turnstile`.
# [auth.captcha]
# enabled = true
# provider = "hcaptcha"
# secret = ""

[auth.email]
# Allow/disallow new user signups via email to your project.
# **Reste à vrai, et ce n'est pas un oubli.** Malgré son nom, cette clé est
# l'interrupteur du fournisseur e-mail entier (`GOTRUE_EXTERNAL_EMAIL_ENABLED`),
# pas celui des seules inscriptions. À faux, toute la pile répond
# « 422 email_provider_disabled — Email logins are disabled », y compris à un
# compte du jeu de données qui demande son code : plus personne ne se connecte.
# Vérifié contre la pile locale le 20 septembre 2026. C'est `auth.enable_signup`
# ci-dessus qui ferme la création de comptes.
enable_signup = true
# If enabled, a user will be required to confirm any email change on both the old, and new email
# addresses. If disabled, only the new email is required to confirm.
double_confirm_changes = true
# If enabled, users need to confirm their email address before signing in.
enable_confirmations = false
# If enabled, users will need to reauthenticate or have logged in recently to change their password.
secure_password_change = false
# Controls the minimum amount of time that must pass before sending another signup confirmation or password reset email.
max_frequency = "1s"
# Number of characters used in the email OTP.
otp_length = 6
# Number of seconds before the email OTP expires (defaults to 1 hour).
otp_expiry = 3600

# Use a production-ready SMTP server
# [auth.email.smtp]
# enabled = true
# host = "smtp.sendgrid.net"
# port = 587
# user = "apikey"
# pass = "env(SENDGRID_API_KEY)"
# admin_email = "admin@email.com"
# sender_name = "Admin"

# Gabarits de courriel, en français (ticket 005). Le chemin est relatif à la
# racine du dépôt. `signInWithOtp` sur un compte existant déclenche le gabarit
# `magic_link` : il porte le code à six chiffres (`{{ .Token }}`) **et** le lien
# (`{{ .ConfirmationURL }}`), les deux façons de se connecter.
[auth.email.template.magic_link]
subject = "Ton code de connexion — Astreinte SP"
content_path = "./supabase/templates/magic_link.html"

# Le gabarit d'invitation appartient au ticket 006.
# [auth.email.template.invite]
# subject = "Tu es invité à rejoindre ta caserne"
# content_path = "./supabase/templates/invite.html"

# Uncomment to customize notification email template
# [auth.email.notification.password_changed]
# enabled = true
# subject = "Your password has been changed"
# content_path = "./supabase/templates/password_changed_notification.html"

[auth.sms]
# Allow/disallow new user signups via SMS to your project.
enable_signup = false
# If enabled, users need to confirm their phone number before signing in.
enable_confirmations = false
# Template for sending OTP to users
template = "Your code is {{ .Code }}"
# Controls the minimum amount of time that must pass before sending another sms otp.
max_frequency = "5s"

# Use pre-defined map of phone number to OTP for testing.
# [auth.sms.test_otp]
# 4152127777 = "123456"

# Configure logged in session timeouts.
# [auth.sessions]
# Force log out after the specified duration.
# timebox = "24h"
# Force log out if the user has been inactive longer than the specified duration.
# inactivity_timeout = "8h"

# This hook runs before a new user is created and allows developers to reject the request based on the incoming user object.
# [auth.hook.before_user_created]
# enabled = true
# uri = "pg-functions://postgres/auth/before-user-created-hook"

# This hook runs before a token is issued and allows you to add additional claims based on the authentication method used.
# [auth.hook.custom_access_token]
# enabled = true
# uri = "pg-functions://<database>/<schema>/<hook_name>"

# Configure one of the supported SMS providers: `twilio`, `twilio_verify`, `messagebird`, `textlocal`, `vonage`.
[auth.sms.twilio]
enabled = false
account_sid = ""
message_service_sid = ""
# DO NOT commit your Twilio auth token to git. Use environment variable substitution instead:
auth_token = "env(SUPABASE_AUTH_SMS_TWILIO_AUTH_TOKEN)"

# Multi-factor-authentication is available to Supabase Pro plan.
[auth.mfa]
# Control how many MFA factors can be enrolled at once per user.
max_enrolled_factors = 10

# Control MFA via App Authenticator (TOTP)
[auth.mfa.totp]
enroll_enabled = false
verify_enabled = false

# Configure MFA via Phone Messaging
[auth.mfa.phone]
enroll_enabled = false
verify_enabled = false
otp_length = 6
template = "Your code is {{ .Code }}"
max_frequency = "5s"

# Configure MFA via WebAuthn
# [auth.mfa.web_authn]
# enroll_enabled = true
# verify_enabled = true

# Use an external OAuth provider. The full list of providers are: `apple`, `azure`, `bitbucket`,
# `discord`, `facebook`, `github`, `gitlab`, `google`, `keycloak`, `linkedin_oidc`, `notion`, `twitch`,
# `twitter`, `x`, `slack`, `spotify`, `workos`, `zoom`.
[auth.external.apple]
enabled = false
client_id = ""
# DO NOT commit your OAuth provider secret to git. Use environment variable substitution instead:
secret = "env(SUPABASE_AUTH_EXTERNAL_APPLE_SECRET)"
# Overrides the default auth callback URL derived from auth.external_url.
redirect_uri = ""
# Overrides the default auth provider URL. Used to support self-hosted gitlab, single-tenant Azure,
# or any other third-party OIDC providers.
url = ""
# If enabled, the nonce check will be skipped. Required for local sign in with Google auth.
skip_nonce_check = false
# If enabled, it will allow the user to successfully authenticate when the provider does not return an email address.
email_optional = false

# Allow Solana wallet holders to sign in to your project via the Sign in with Solana (SIWS, EIP-4361) standard.
# You can configure "web3" rate limit in the [auth.rate_limit] section and set up [auth.captcha] if self-hosting.
[auth.web3.solana]
enabled = false

# Use Firebase Auth as a third-party provider alongside Supabase Auth.
[auth.third_party.firebase]
enabled = false
# project_id = "my-firebase-project"

# Use Auth0 as a third-party provider alongside Supabase Auth.
[auth.third_party.auth0]
enabled = false
# tenant = "my-auth0-tenant"
# tenant_region = "us"

# Use AWS Cognito (Amplify) as a third-party provider alongside Supabase Auth.
[auth.third_party.aws_cognito]
enabled = false
# user_pool_id = "my-user-pool-id"
# user_pool_region = "us-east-1"

# Use Clerk as a third-party provider alongside Supabase Auth.
[auth.third_party.clerk]
enabled = false
# Obtain from https://clerk.com/setup/supabase
# domain = "example.clerk.accounts.dev"

# OAuth server configuration
[auth.oauth_server]
# Enable OAuth server functionality
enabled = false
# Path for OAuth consent flow UI
authorization_url_path = "/oauth/consent"
# Allow dynamic client registration
allow_dynamic_registration = false

[edge_runtime]
enabled = true
# Supported request policies: `oneshot`, `per_worker`.
# `per_worker` (default) — enables hot reload during local development.
# `oneshot` — fallback mode if hot reload causes issues (e.g. in large repos or with symlinks).
policy = "per_worker"
# Port to attach the Chrome inspector for debugging edge functions.
inspector_port = 8083
# The Deno major version to use.
deno_version = 2

# [edge_runtime.secrets]
# secret_key = "env(SECRET_VALUE)"

# Edge Functions du ticket 006. `verify_jwt = true` : la passerelle rejette les
# requêtes sans jeton porteur. Ce n'est qu'un premier filtre — la clé anon est un
# JWT valide et publique — et chaque fonction revérifie l'identité *et* le rôle de
# l'appelant auprès de GoTrue. Variables d'environnement : supabase/functions/README.md.
[functions.invite-member]
enabled = true
verify_jwt = true

[functions.accept-invitation]
enabled = true
verify_jwt = true

# Edge Function du ticket 019. `verify_jwt = true` comme les deux fonctions du 006 :
# elle est appelée par l'administrateur connecté, avec son jeton. Le portier ne dit
# rien du rôle — c'est `publish_schedule` (migration 0019) qui l'établit en base.
[functions.publish-schedule]
enabled = true
verify_jwt = true

# Edge Function du ticket 020. Réattribution d'un créneau publié, appelée par
# l'administrateur connecté : `verify_jwt = true`, et le rôle est revérifié en base.
# Déclarée explicitement depuis le ticket 049 : c'était déjà la valeur par défaut,
# mais la mise en ligne et la vérification d'écart lisent ce fichier, et un défaut
# implicite ne se vérifie pas.
[functions.reassign-shift]
enabled = true
verify_jwt = true

# Edge Function du ticket 018. Même cas que `reassign-shift` : l'administrateur
# connecté propose un remplissage, la base revérifie chaque ligne (migration 0028).
[functions.auto-propose]
enabled = true
verify_jwt = true

# Edge Function du ticket 025. `verify_jwt = false`, et c'est raisonné : cette
# fonction n'est jamais appelée par un client, mais par pg_net (migration 0014) et
# par d'autres Edge Functions. pg_net ne porte aucun JWT, et lui en donner un
# supposerait de ranger la clé de service en clair dans la base. La fonction
# authentifie donc elle-même ses appelants : clé de service en jeton porteur, ou
# en-tête `x-notify-secret` comparé au secret engendré dans Vault par la migration.
# Tout le reste est rejeté en 401. Voir supabase/functions/README.md.
[functions.send-notification]
enabled = true
verify_jwt = false

# Edge Functions du ticket 029. `create-checkout` est appelée par l'administrateur
# connecté : `verify_jwt = true`, et le rôle est revérifié en base — `station_id`
# désigne la caserne visée, il ne prouve aucun droit.
[functions.create-checkout]
enabled = true
verify_jwt = true

# `stripe-webhook` est **publique par nature** : Stripe appelle sans jeton, donc
# `verify_jwt = false`. Ce qui authentifie l'appelant est la **signature** de
# l'événement (`Stripe-Signature`, HMAC-SHA256 du corps brut avec
# `STRIPE_WEBHOOK_SECRET`) : sans elle, ou fausse, ou hors de la fenêtre de cinq
# minutes, la fonction répond 400 sans même analyser le corps. Tant que le secret
# n'est pas posé, **tout est refusé** en 503 — jamais accepté sans vérification.
# Voir supabase/functions/README.md et docs/STRIPE.md.
[functions.stripe-webhook]
enabled = true
verify_jwt = false

# Edge Function du ticket 007. `verify_jwt = true`, et la fonction **n'accepte aucun
# corps** : l'identité du compte à supprimer vient du JWT, vérifiée auprès de GoTrue.
# Un `user_id` lu dans la requête ferait de cette fonction une porte pour supprimer
# le compte d'un autre. Voir supabase/functions/README.md et migration 0026.
[functions.delete-account]
enabled = true
verify_jwt = true

# Edge Function du ticket 034. Même verrou que `delete-account`, pour un enjeu
# symétrique : celle-ci ne détruit rien, elle **livre** le dossier complet d'une
# personne. L'identité vient du JWT, un corps de requête est ignoré, et la
# fonction SQL `export_own_data` (migration 0027) est fermée à `anon` comme à
# `authenticated`. Voir supabase/functions/README.md et docs/RGPD.md.
[functions.export-user-data]
enabled = true
verify_jwt = true

# Edge Function du ticket 028. `verify_jwt = false`, et c'est la nature même de
# la fonction : ses appelants sont Google Agenda, iCloud et Outlook, qui vont
# chercher l'adresse depuis leurs serveurs toutes les heures. Aucun ne sait
# porter un jeton d'accès Supabase, aucun ne renouvelle une session. Ce qui
# authentifie l'appelant est le **secret dans l'URL** (`profiles.ics_token`,
# 192 bits, migration 0029) — même raisonnement que `stripe-webhook`, où c'est
# la signature qui fait office de portier. Le contenu servi est décidé en base
# par `ics_feed_events`, fermée à `anon` comme à `authenticated`.
# Voir supabase/functions/README.md et design/028-export-ics.md.
[functions.ics-feed]
enabled = true
verify_jwt = false

# Désactivé en local : Logflare et Vector échouent leur bilan de santé sous Rancher Desktop
# et ne servent qu'aux journaux dans Studio. Aucun effet sur le projet hébergé.
[analytics]
enabled = false
port = 54327
# Configure one of the supported backends: `postgres`, `bigquery`.
backend = "postgres"

# Experimental features may be deprecated any time
[experimental]
# Configures Postgres storage engine to use OrioleDB (S3)
orioledb_version = ""
# Configures S3 bucket URL, eg. <bucket_name>.s3-<region>.amazonaws.com
s3_host = "env(S3_HOST)"
# Configures S3 bucket region, eg. us-east-1
s3_region = "env(S3_REGION)"
# Configures AWS_ACCESS_KEY_ID for S3 bucket
s3_access_key = "env(S3_ACCESS_KEY)"
# Configures AWS_SECRET_ACCESS_KEY for S3 bucket
s3_secret_key = "env(S3_SECRET_KEY)"

# pg-delta is the schema diff engine for db diff / db pull / db remote commit.
# Set enabled = false to fall back to the legacy migra engine.
[experimental.pgdelta]
enabled = true
# Directory under `supabase/` where declarative files are written.
# declarative_schema_path = "./schemas"
# JSON string passed through to pg-delta SQL formatting. When omitted, SQL is
# formatted with uppercase keywords, indent 2, max width 180, trailing commas,
# and column/key alignment. Set to "null" to emit raw, unformatted SQL.
# format_options = "{\"keywordCase\":\"upper\",\"indent\":2,\"maxWidth\":180,\"commaStyle\":\"trailing\"}"

# ---------------------------------------------------------------------------
# Le projet hébergé — ticket 049
# ---------------------------------------------------------------------------
#
# Tout ce qui précède décrit la **pile locale**. `supabase config push` pousse
# vers le projet hébergé ce que ce fichier déclare, et laisse intact ce qu'il ne
# déclare pas. Poussé tel quel, il ramènerait donc la production sur
# `http://127.0.0.1:3000` : plus aucun lien de connexion ne fonctionnerait.
#
# D'où ce bloc. Un `[remotes.<nom>]` dont le `project_id` correspond à la cible
# **remplace** les valeurs du bloc de base, et seulement celles-là. Vérifié le
# 21 septembre 2026 : `supabase config diff --project-ref …` annonce
# « using [remotes.production] » et tombe de dix-huit écarts à deux.
#
# **Pourquoi la référence du projet est écrite ici**, alors que le ticket 049 la
# voulait en secret GitHub seulement : le CLI sélectionne le remote en comparant
# `project_id` à la cible, **avant** toute substitution `env(…)`. Essayé, mesuré :
# `project_id = "env(SUPABASE_PROJECT_REF)"` laisse le CLI sur le bloc de base,
# c'est-à-dire sur la configuration locale, c'est-à-dire sur la panne qu'on répare.
# La référence n'est pas un secret — c'est le sous-domaine public de l'API, présent
# dans chaque requête de la PWA. Le jeton d'accès, lui, reste un secret GitHub et
# n'apparaît nulle part ici. `SUPABASE_PROJECT_REF` reste le secret utilisé par le
# workflow pour viser le projet ; ce `project_id` ne fait que désigner *quel* bloc
# s'applique quand c'est cette cible.
[remotes.production]
project_id = "axvflcgwsmrjrnjheoly"

# Les quatre réglages qui manquaient le 21 septembre 2026 et qui ont laissé un
# pompier à la porte : adresses de redirection, serveur d'envoi, plafond, gabarit.
# Le gabarit et son sujet sont déclarés dans le bloc de base
# (`[auth.email.template.magic_link]`) et suivent d'eux-mêmes.
[remotes.production.auth]
# L'origine servie par Vercel. Sans elle, le lien du courriel renvoie sur
# `localhost` et le code à six chiffres arrive dans un gabarit anglais.
site_url = "https://astreinte.staticflow.ch"
# Le domaine propre **et** l'adresse Vercel, chacun avec son joker de chemin :
# le lien d'invitation ramène sur `/invite/<jeton>`, pas sur la racine (ticket 046).
additional_redirect_urls = [
  "https://astreinte.staticflow.ch",
  "https://astreinte.staticflow.ch/**",
  "https://astreinte-manager.vercel.app",
  "https://astreinte-manager.vercel.app/**",
]

# Le plafond du plan gratuit — deux courriels par heure — suffit à bloquer une
# soirée d'invitations. 60, comme le tableau de bord le porte depuis le
# 21 septembre 2026. Déclarer cette section suffit à la faire gérer par
# `config push` : sans elle, le CLI la range dans « non comparé ».
[remotes.production.auth.rate_limit]
email_sent = 60

# Une seconde entre deux envois est bon pour Mailpit, pas pour de vraies boîtes.
[remotes.production.auth.email]
max_frequency = "60s"

# **Le serveur d'envoi.** Resté celui de Supabase, il interdit tout gabarit
# personnalisé : c'est la cause directe du courriel anglais. Le mot de passe est
# la clé d'API Resend ; elle ne peut pas vivre dans le dépôt, elle vient du secret
# GitHub `SUPABASE_AUTH_SMTP_PASSWORD`. Le workflow **refuse de pousser** la
# configuration tant que ce secret est absent, plutôt que d'écrire un mot de passe
# vide et de couper tous les courriels (docs/DEPLOIEMENT.md § 3).
[remotes.production.auth.email.smtp]
enabled = true
host = "smtp.resend.com"
port = 465
user = "resend"
pass = "env(SUPABASE_AUTH_SMTP_PASSWORD)"
admin_email = "invitations@staticflow.ch"
sender_name = "Astreinte SP"

# Les trois blocs qui suivent ne changent rien : ils **empêchent** `config push`
# de ramener la production sur des valeurs de développement. Sans eux, la mise en
# ligne réduirait le pool de connexions, désactiverait des services du plan
# hébergé, et personne ne ferait le lien entre le déploiement et la lenteur.
[remotes.production.auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[remotes.production.db.pooler]
default_pool_size = 15
max_client_conn = 200

[remotes.production.storage.analytics]
enabled = true
max_namespaces = 10

# **L'adresse du répartiteur de notifications.** Créée par la migration 0014 avec
# l'adresse Docker de la pile locale, jamais remplacée en production : pendant des
# semaines, `cron_dispatch_notifications` a poussé toutes les minutes vers un hôte
# inexistant, la file s'est remplie, et rien ne l'a dit.
#
# `supabase db push` met à jour les secrets Vault déclarés ici **avant** de jouer
# les migrations. La mise en ligne la pose donc à chaque passage, sans effet quand
# elle est déjà bonne, et `scripts/verifier_production.sh` la contrôle ensuite.
# Ce n'est pas un secret : c'est l'adresse publique de la fonction. Le secret qui
# l'accompagne (`notify_shared_secret`) est engendré au hasard par la migration et
# n'est recopié nulle part — voir supabase/functions/README.md.
[remotes.production.db.vault]
notify_function_url = "https://axvflcgwsmrjrnjheoly.supabase.co/functions/v1/send-notification"
