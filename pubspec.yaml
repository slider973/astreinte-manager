name: astreinte_sp
description: "Gestion des astreintes pour les centres de secours (iOS, Android, Web)."
publish_to: 'none'

# Version applicative : build-name (versionName / CFBundleShortVersionString)
# et build-number (versionCode / CFBundleVersion), surchargés par `flutter build`.
version: 0.1.0+1

environment:
  sdk: ^3.10.9

dependencies:
  # Notifications push (ticket 024). Web d'abord : le SDK JavaScript n'est
  # téléchargé qu'au premier `Firebase.initializeApp`, donc sans les variables
  # `FIREBASE_*` l'application ne joint jamais Google (`docs/FIREBASE.md`).
  # Les deux paquets compilent pour iOS et Android sans configuration native ;
  # leur activation là-bas est le ticket 036.
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  # `usePathUrlStrategy()` : les routes vivent dans le chemin de l'adresse et
  # non dans son fragment, que le fournisseur d'authentification s'approprie
  # (ticket 046, `lib/core/plateforme/strategie_url_web.dart`). Paquet du SDK,
  # sans implémentation hors du web : il n'est atteint que par import
  # conditionnel.
  flutter_web_plugins:
    sdk: flutter
  go_router: ^17.5.0
  http: ^1.6.0
  # Déjà tirées par supabase_flutter : les déclarer ici ne change pas l'arbre
  # de dépendances, il rend seulement l'usage direct explicite.
  #   - shared_preferences : les repères d'accueil vus une fois (guide,
  #     aide à l'installation). Implémentation web : localStorage.
  #   - web : le seul canal pour lire le mode d'affichage de la PWA et
  #     l'agent utilisateur, derrière un import conditionnel.
  shared_preferences: ^2.5.5
  supabase_flutter: ^2.17.2
  web: ^1.1.1

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  # Polices embarquées, jamais chargées depuis un CDN : la PWA doit s'ouvrir
  # vite en 4G rurale et un FOUT sur une grille d'états est un défaut de
  # lecture. Provenance, sous-ensemble et poids : assets/fonts/README.md.
  fonts:
    - family: AtkinsonHyperlegibleNext
      fonts:
        - asset: assets/fonts/AtkinsonHyperlegibleNext-Regular.ttf
          weight: 400
        - asset: assets/fonts/AtkinsonHyperlegibleNext-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/AtkinsonHyperlegibleNext-Bold.ttf
          weight: 700
    - family: AtkinsonHyperlegibleMono
      fonts:
        - asset: assets/fonts/AtkinsonHyperlegibleMono-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/AtkinsonHyperlegibleMono-Bold.ttf
          weight: 700

    # --- Le repli de dernier recours du moteur (ticket 037) ---------------
    #
    # CanvasKit exige une police de dernier recours, sans quoi il plante en
    # mettant en page du texte dont la famille n'est pas enregistrée. Il l'a
    # choisie pour nous : Roboto. Et **tant qu'aucune famille de ce nom n'est
    # déclarée ici**, il la télécharge sans condition depuis
    # `fonts.gstatic.com` à chaque démarrage — 63 Ko chez un tiers, mesurés au
    # ticket 032, pour une police qu'on n'affiche jamais.
    #
    # Le moteur ne compare que le nom (`loadAssetFonts`, engine/canvaskit/
    # fonts.dart) : une famille `Roboto` dans le manifeste suffit à supprimer
    # le téléchargement. Elle pointe sur un sous-ensemble minuscule de
    # l'Atkinson régulière — si ce dernier recours doit servir un jour, autant
    # qu'il ressemble au produit plutôt qu'à une police d'Android.
    #
    # Pourquoi un sixième fichier plutôt qu'un renvoi vers la régulière déjà
    # embarquée : le moteur télécharge **une fois par famille**, pas une fois
    # par fichier. Deux familles sur la même adresse font deux requêtes
    # simultanées, donc 18 Ko de plus (mesuré). Le sous-ensemble, lui, en pèse
    # 6 — et aucun écran ne l'affiche jamais. Voir `assets/fonts/README.md`.
    - family: Roboto
      fonts:
        - asset: assets/fonts/AtkinsonHyperlegibleNext-Repli.ttf
          weight: 400
