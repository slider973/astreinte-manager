name: astreinte_sp
description: "Gestion des astreintes pour les centres de secours (iOS, Android, Web)."
publish_to: 'none'

# Version applicative : build-name (versionName / CFBundleShortVersionString)
# et build-number (versionCode / CFBundleVersion), surchargés par `flutter build`.
version: 0.1.0+1

environment:
  sdk: ^3.10.9

dependencies:
  # Notifications push (ticket 024). Web d'abord : le SDK JavaScript n'est
  # téléchargé qu'au premier `Firebase.initializeApp`, donc sans les variables
  # `FIREBASE_*` l'application ne joint jamais Google (`docs/FIREBASE.md`).
  # Les deux paquets compilent pour iOS et Android sans configuration native ;
  # leur activation là-bas est le ticket 036.
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  go_router: ^17.5.0
  http: ^1.6.0
  # Déjà tirées par supabase_flutter : les déclarer ici ne change pas l'arbre
  # de dépendances, il rend seulement l'usage direct explicite.
  #   - shared_preferences : les repères d'accueil vus une fois (guide,
  #     aide à l'installation). Implémentation web : localStorage.
  #   - web : le seul canal pour lire le mode d'affichage de la PWA et
  #     l'agent utilisateur, derrière un import conditionnel.
  shared_preferences: ^2.5.5
  supabase_flutter: ^2.17.2
  web: ^1.1.1

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  # Polices embarquées, jamais chargées depuis un CDN : la PWA doit s'ouvrir
  # vite en 4G rurale et un FOUT sur une grille d'états est un défaut de
  # lecture. Provenance, sous-ensemble et poids : assets/fonts/README.md.
  fonts:
    - family: AtkinsonHyperlegibleNext
      fonts:
        - asset: assets/fonts/AtkinsonHyperlegibleNext-Regular.ttf
          weight: 400
        - asset: assets/fonts/AtkinsonHyperlegibleNext-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/AtkinsonHyperlegibleNext-Bold.ttf
          weight: 700
    - family: AtkinsonHyperlegibleMono
      fonts:
        - asset: assets/fonts/AtkinsonHyperlegibleMono-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/AtkinsonHyperlegibleMono-Bold.ttf
          weight: 700
